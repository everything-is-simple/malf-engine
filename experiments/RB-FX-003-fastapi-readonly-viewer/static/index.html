<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RiskBench Factory Viewer</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#081018;color:#e8f1f5}body{max-width:72rem;margin:auto;padding:1rem}.warning{border:1px solid #f4b942;background:#2e250d;padding:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem}.card{border:1px solid #325166;border-radius:.5rem;padding:1rem;background:#101d27}dt{color:#88a9bd}dd{margin:0 0 .75rem}.unknown{color:#f4b942}@media(max-width:480px){body{padding:.5rem}}
  </style>
</head>
<body>
  <header><h1>Asteria RiskBench — 工厂只读样机</h1><p id="limit" class="warning">research_only · raw_none · 非 operational · 不构成交易建议</p></header>
  <main>
    <section aria-labelledby="summary-title"><h2 id="summary-title">风险概览</h2><dl id="meta"></dl></section>
    <section aria-labelledby="detail-title"><h2 id="detail-title">标的详情</h2><div id="coordinates" class="grid"></div></section>
    <section aria-labelledby="audit-title"><h2 id="audit-title">审计详情</h2><pre id="audit"></pre></section>
  </main>
<script type="module">
const res = await fetch('/api/current', {cache:'no-store'});
if(!res.ok) throw new Error('published_snapshot_unavailable');
const s = await res.json();
meta.innerHTML = `<dt>评估日</dt><dd>${s.evaluation_date}</dd><dt>数据截止</dt><dd>${s.data_end_date}</dd><dt>预设</dt><dd>${s.profile}</dd>`;
coordinates.innerHTML = Object.entries(s.coordinates).map(([period,v]) => `<article class="card"><h3>${period}</h3><p>Core: ${v.core}</p><p class="unknown">Range: ${v.range ?? 'None'}</p><p>${v.reason_codes.join(', ')}</p></article>`).join('');
audit.textContent = JSON.stringify(s.lineage,null,2);
</script>
</body>
</html>
