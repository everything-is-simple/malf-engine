[project]
name = "malf-engine"
version = "0.0.1"
description = "MALF v2.0 structural computation core — deterministic, single-pass, zero-dependency domain core."
requires-python = ">=3.10"
# 🔒 领域核心零外部依赖：这是 replay 确定性（O8 / spec §7.4）的硬要求，不是极简偏好。
# numpy 的 float64 尾数在不同版本/CPU 上可能微差，一旦进 lineage_hash 的 format(x,'.17g') 输入，
# replay 校验立刻变噪声。任何"引外部库加速"的诱惑，答案永远是不。
dependencies = []

[project.optional-dependencies]
# 只在测试期用；不进领域核心。
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
